<article class="producto">
    <div class="imagen">
        {% if producto.imagen %}<img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}">{% endif %}
    </div>
    <h3>{{ producto.nombre }}</h3>
    <p class="precio">${{ producto.precio|floatformat:"0g" }}</p>
    <p class="meta">
        <span class="etiqueta">Talla {{ producto.talla }}</span>
        {% if producto.stock == 0 %}<span class="etiqueta agotado">Agotado</span>{% endif %}
    </p>
    <a class="boton" href="{% url 'detalle_producto' producto.pk %}">Ver detalle</a>
</article>
